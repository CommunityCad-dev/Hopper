# CommunityCAD injection, server context. Managed by communitycad install.sh.
# Included from inside the interface's server { } block; requires communitycad-http.conf.

sub_filter $ccad_index_match '<script src="/communitycad/inject.js" defer></script></head>';

# The service worker precaches index.html keyed by a hash in sw.js and serves every
# navigation from that copy. Changing the hash makes browsers install a new service
# worker, which re-fetches the (injected) index.html. Removing this rule reverts it the
# same way. The strings are templated because Mainsail and Fluidd differ here.
sub_filter $ccad_sw_match '@CCAD_SW_REPLACE@';

sub_filter_types application/javascript text/javascript;
sub_filter_once on;

# The browser's update check revalidates sw.js with the stock file's ETag/Last-Modified, and
# nginx answers 304 from the unchanged file before sub_filter runs, so the rewrite would never
# be seen. Disable validators for sw.js only.
location = /sw.js {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache";
}

location ^~ /communitycad/ {
    alias @CCAD_WEB_DIR@/;
    add_header Cache-Control "no-cache";
}
