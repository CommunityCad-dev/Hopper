# CommunityCAD injection, http context. Managed by communitycad install.sh.
# sub_filter skips any pair whose search string evaluates to "", so these maps limit
# the rewrite to exactly two responses: the interface's index.html and its service
# worker. Every other response (JS bundles, API, webcams) passes through untouched.
map $uri $ccad_index_match {
    /index.html '</head>';
    default     '';
}

# The service-worker search string differs per interface -- see install.sh. Mainsail
# emits {url:"index.html",revision:"<hash>"}; Fluidd emits
# {"revision":"<hash>","url":"index.html"}, revision first, so there is nothing to
# anchor on but the revision itself. index.html is the first entry in Fluidd's
# manifest and owns the first non-null revision in the file, which is why
# sub_filter_once hits the right one. If that ever stops being true the rewrite
# silently stops working, which is what scripts/healthcheck.sh watches for.
map $uri $ccad_sw_match {
    /sw.js  '@CCAD_SW_MATCH@';
    default '';
}
